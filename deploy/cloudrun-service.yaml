apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: niyojan-recruitment-platform
  labels:
    cloud.googleapis.com/location: asia-east1
    app.kubernetes.io/name: niyojan
    app.kubernetes.io/part-of: recruitment-platform
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/client.name: ai-studio-build
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        # Autoscaling constraints
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        # Concurrency: 80 concurrent connections per container instance
        container.googleapis.com/concurrency: "80"
        # Dedicated GCP Service Account for Least-Privilege IAM
        run.googleapis.com/service-account: "niyojan-sa@gen-lang-client-0148283337.iam.gserviceaccount.com"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - name: niyojan-app
          image: asia-east1-docker.pkg.dev/gen-lang-client-0148283337/niyojan/app:v1.0.0
          ports:
            - name: http1
              containerPort: 3000
          resources:
            limits:
              cpu: "2000m"
              memory: "2048Mi"
            requests:
              cpu: "1000m"
              memory: "1024Mi"
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: FIREBASE_PROJECT_ID
              value: "gen-lang-client-0148283337"
            - name: FIREBASE_DATABASE_ID
              value: "ai-studio-remixremixremixr-a44fc6b2-6b71-479c-8eb8-6312d2f0e1cd"
            - name: FIREBASE_STORAGE_BUCKET
              value: "gen-lang-client-0148283337.firebasestorage.app"
            - name: APP_URL
              value: "https://ais-dev-cqykmgx2ey7uygnwxacurf-407283135884.asia-east1.run.app"
            - name: CORS_ORIGIN
              value: "https://ais-dev-cqykmgx2ey7uygnwxacurf-407283135884.asia-east1.run.app,https://ais-pre-cqykmgx2ey7uygnwxacurf-407283135884.asia-east1.run.app"
            - name: LOG_LEVEL
              value: "info"
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
